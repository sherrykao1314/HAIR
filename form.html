<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisher Salon | VIP 專屬資料登錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { background-color: #FDFBF7; font-family: 'Noto Sans TC', sans-serif; color: #4A4A4A; }
        .serif { font-family: 'Noto Serif TC', serif; }
        .form-container { max-width: 500px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(200,169,126,0.15); }
        .btn-custom { background-color: #C8A97E; color: white; border-radius: 12px; font-weight: bold; padding: 12px; border: none; }
        .btn-custom:hover { background-color: #b5956a; color: white; }
        .form-control, .form-select { border-radius: 12px; border: 1px solid #e5e5e5; padding: 12px 15px; background-color: #faf9f7; }
        .form-control:focus, .form-select:focus { border-color: #C8A97E; box-shadow: 0 0 0 0.2rem rgba(200,169,126,0.25); }
    </style>
</head>
<body>

<div class="container px-4">
    <div class="form-container">
        <div class="text-center mb-4">
            <h3 class="serif fw-bold" style="color: #C8A97E;">✨ Fisher Salon</h3>
            <p class="text-muted small mt-2">VIP 專屬資料登錄</p>
            <div style="background: #fcf4ea; padding: 15px; border-radius: 12px; font-size: 0.9rem; color: #8e7d71; text-align: left;">
                為了未來能為您提供更精準的髮型建議，以及發送專屬的生日與節慶福利🎁<br>
                請協助花 1 分鐘填寫您的資料，非常感謝！
            </div>
        </div>

        <form id="customerForm">
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary">姓名 *</label>
                <input type="text" class="form-control" id="cName" placeholder="請輸入您的真實姓名" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary">手機號碼 *</label>
                <input type="tel" class="form-control" id="cPhone" placeholder="09xxxxxxxx" required>
            </div>

            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label fw-bold small text-secondary">生日</label>
                    <input type="text" class="form-control" id="cBirthday" placeholder="例: 12/17">
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold small text-secondary">性別</label>
                    <select class="form-select" id="cGender">
                        <option value="女">女</option>
                        <option value="男">男</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label fw-bold small text-secondary">年齡層</label>
                    <select class="form-select" id="cAge">
                        <option value="">不想透露</option>
                        <option value="< 20歲">&lt; 20歲</option>
                        <option value="21-25歲">21-25歲</option>
                        <option value="26-30歲">26-30歲</option>
                        <option value="31-40歲">31-40歲</option>
                        <option value="41-50歲">41-50歲</option>
                        <option value="50歲以上">50歲以上</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold small text-secondary">LINE ID (選填)</label>
                    <input type="text" class="form-control" id="cLine" placeholder="不是LINE的名字唷!">
                </div>
            </div>

            <button type="submit" class="btn btn-custom w-100 mt-3" id="submitBtn">送出資料</button>
        </form>

        <!-- 送出成功畫面 -->
        <div id="successMsg" style="display: none;" class="text-center mt-4">
            <h4 class="serif text-success fw-bold">🎉 感謝您的填寫！</h4>
            <p class="text-muted mt-2">資料已成功建檔。</p>
        </div>
    </div>
</div>

<script>
    // ⚠️ 請確保這裡的網址，跟你系統裡的 GAS_URL 是一模一樣的！
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwKadEE9GfMYxDG6cHDz3qaUHFZx6qzG3A7Q8T2HyImWlAP5vt1K-Wn9hk51YZ369Vmug/exec';

    document.getElementById('customerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = '資料傳送中...';
        btn.disabled = true;

        const payload = {
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            birthday: document.getElementById('cBirthday').value,
            gender: document.getElementById('cGender').value,
            ageRange: document.getElementById('cAge').value,
            lineId: document.getElementById('cLine').value
        };

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'customerSubmit', payload: payload })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('customerForm').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
            } else {
                alert('發生錯誤：' + data.message);
                btn.innerText = '送出資料領取福利';
                btn.disabled = false;
            }
        })
        .catch(err => {
            alert('網路錯誤，請稍後再試！');
            btn.innerText = '送出資料領取福利';
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
