<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Fisher客戶管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #C8A97E; --bg-color: #FDFBF7; --text-dark: #4A4A4A; --card-bg: #FFFFFF; }
        body { background-color: var(--bg-color); font-family: 'Noto Sans TC', sans-serif; color: var(--text-dark); }
        h1, h2, h3, h4, h5, .serif { font-family: 'Noto Serif TC', serif; }
        .dashboard-header { background: linear-gradient(135deg, #ffffff 0%, #f4eee8 100%); color: var(--text-dark); padding: 16px 20px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(200,169,126,0.1); border: 1px solid #f0e6da; }
        .card { border: none; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.03); margin-bottom: 18px; background: var(--card-bg); overflow: hidden; }
        .card-header { background: transparent; border-bottom: 1px solid #f0f0f0; font-weight: 700; font-size: 1.05rem; padding: 14px 18px; color: var(--primary-color); }
        .btn-custom { background-color: var(--primary-color); color: white; border-radius: 10px; border: none; transition: 0.3s; }
        .btn-custom:hover { background-color: #b5956a; color: white; }
        .btn-outline-custom { border: 1px solid var(--primary-color); color: var(--primary-color); border-radius: 10px; }
        .btn-outline-custom:hover { background-color: var(--primary-color); color: white; }
        
        .compact-recommend-bar { background: #ffffff; border: 1px solid #f0e6da; border-radius: 14px; padding: 10px 14px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(200,169,126,0.08); }
        .recommend-btn { padding: 5px 12px; font-size: 0.85rem; border-radius: 20px; font-weight: 500; }
        
        .fab { position: fixed; bottom: 35px; right: 30px; width: 60px; height: 60px; background: linear-gradient(135deg, #C8A97E, #D4B996); color: white; border-radius: 50%; text-align: center; line-height: 56px; font-size: 30px; box-shadow: 0 6px 15px rgba(200,169,126,0.4); cursor: pointer; z-index: 1000; transition: transform 0.2s; }
        .fab:hover { transform: scale(1.08); color: white; }
        .reminder-item { padding: 12px 14px; border-left: 4px solid #eaeaea; background: #faf9f7; margin-bottom: 10px; border-radius: 10px; transition: 0.3s; font-size: 0.92rem; }
        
        .border-bday { border-color: #E29578; background: #fff5f2; }
        .border-d2 { border-color: #83C5BE; }
        .border-d7 { border-color: #FFDDD2; }
        .border-danger-soft { border-color: #E76F51; background: #fff6f4; }
        .border-warning-soft { border-color: #E9C46A; }
        .border-info-soft { border-color: #457B9D; background: #f0f8ff; }
        
        .form-control, .form-select { border-radius: 10px; border: 1px solid #e0e0e0; padding: 9px 13px; }
        .badge-soft { background-color: #f4eee8; color: #8e7d71; font-weight: 500; }
        .vip-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: linear-gradient(45deg, #C8A97E, #e8d5b5); color: #fff; font-weight: bold; margin-left: 4px; }
        .warning-text { color: #d63031; font-size: 0.8rem; font-weight: bold; margin-top: 4px; background: #ffeaa7; padding: 3px 6px; border-radius: 4px; display: inline-block; }
        
        .fc a, .fc a:hover { color: inherit !important; text-decoration: none !important; cursor: pointer; }
        .fc .fc-toolbar-title { font-family: 'Noto Serif TC', serif; font-size: 1.15rem !important; color: var(--text-dark); }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #f0f0f0 !important; }
        .fc-theme-standard th { background: #faf9f7; padding: 4px 0; }
        .fc-col-header-cell-cushion { color: var(--primary-color) !important; font-weight: 700; font-size: 0.85rem; }
        .fc-daygrid-day-number { color: #8e7d71 !important; font-weight: 500; padding: 6px !important; }
        .fc-day-today { background-color: #fff9f0 !important; }
        .fc-event { border: none !important; border-radius: 5px !important; padding: 2px 4px !important; font-size: 0.8rem; }
        .fc-button-primary { background-color: var(--primary-color) !important; border-color: var(--primary-color) !important; border-radius: 8px !important; font-size: 0.85rem !important; padding: 4px 10px !important; }
        .history-photo { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border: 1.5px solid #f0e6da; cursor: pointer; transition: transform 0.2s; background-color: #eee; }
        .history-photo:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="dashboard-header d-flex justify-content-between align-items-center">
        <h3 class="m-0 serif text-dark">✨ Fisher Salon</h3>
        <span id="todayDate" class="text-muted small"></span>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="compact-recommend-bar">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
                    <div class="d-flex align-items-center gap-1 text-secondary small fw-bold">
                        <span>💡</span> <span>潛在業績推薦 (含話術生成)</span>
                    </div>
                    <div class="d-flex gap-1 flex-wrap">
                        <button class="btn btn-outline-custom recommend-btn" onclick="getRecommend('剪髮')">✂️ 剪髮</button>
                        <button class="btn btn-outline-custom recommend-btn" onclick="getRecommend('染髮')">🎨 染髮</button>
                        <button class="btn btn-outline-custom recommend-btn" onclick="getRecommend('燙髮')">🌊 燙髮</button>
                        <button class="btn btn-outline-custom recommend-btn" onclick="getRecommend('護髮')">🌿 護髮</button>
                    </div>
                </div>
                
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light border-0" style="border-radius: 10px 0 0 10px;">🎯 全年節慶行銷</span>
                    <select class="form-select border-0 bg-light" id="festivalSelect" style="border-radius: 0 10px 10px 0;">
                        <option value="">選擇要推播的主題檔期...</option>
                        <option value="節慶：1月 過年早鳥收割">🧨 1月 過年 VIP 早鳥卡位</option>
                        <option value="節慶：2月 情人節 / 招桃花">🌸 2月 情人節 / 招桃花髮色</option>
                        <option value="節慶：3月 換季頭皮舒緩">🌱 3月 換季頭皮舒緩理療</option>
                        <option value="節慶：4月 春夏輕盈大改造">☀️ 4月 春夏輕盈短髮改造</option>
                        <option value="節慶：母親節">🌷 4-5月 母親節 (母女同行/寵愛媽咪)</option>
                        <option value="節慶：6月 畢業求職面試">🎓 6月 畢業求職必勝髮型</option>
                        <option value="節慶：7月 夏日控油防曬">🏖️ 7月 夏日控油 / 出遊亮色</option>
                        <option value="節慶：父親節">👔 7-8月 父親節 (男士理容/送禮)</option>
                        <option value="節慶：七夕情人節">💖 8月 七夕情人節 (約會大改造)</option>
                        <option value="節慶：9月 秋季換色潮">🍁 9月 秋季換色潮 (除布丁頭)</option>
                        <option value="節慶：10月 曬後受損急救">🍂 10月 夏日曬後深層急救</option>
                        <option value="節慶：11月 產品週年慶囤貨">🛍️ 11月 洗護產品囤貨大賞</option>
                        <option value="節慶：12月 聖誕跨年派對">🎄 12月 聖誕跨年派對閃耀</option>
                    </select>
                    <button class="btn btn-custom btn-sm px-3" onclick="getRecommend(document.getElementById('festivalSelect').value)" style="border-radius: 10px; margin-left: 5px;">搜尋名單</button>
                </div>

                <div id="recommendResultArea" style="display: none; margin-top: 10px; border-top: 1px dashed #f0e6da; padding-top: 8px;">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 id="recommendTitle" class="fw-bold m-0 small text-secondary"></h6>
                        <button class="btn-close" style="font-size: 0.7rem;" onclick="document.getElementById('recommendResultArea').style.display='none'"></button>
                    </div>
                    <div id="recommendList" style="max-height: 240px; overflow-y: auto;"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span style="font-size: 1.1rem;">📅</span> 客戶搜尋與預約總覽</div>
                <div class="card-body p-3">
                    <div class="input-group mb-3 shadow-sm" style="border-radius: 10px; overflow: hidden;">
                        <select class="form-select border-0 bg-light" id="searchTagFilter" style="max-width: 135px; font-size:0.9rem;">
                            <option value="">所有標籤</option>
                            <optgroup label="客戶分級">
                                <option value="VVIP">👑 VVIP (>3萬)</option>
                                <option value="VIP">💎 VIP (>1萬)</option>
                                <option value="老客戶">🌟 老客戶 (4次+)</option>
                                <option value="新客戶">🌱 新客戶 (2次內)</option>
                                <option value="潛在流失">🚨 潛在流失</option>
                            </optgroup>
                            <optgroup label="消費行為">
                                <option value="高頻低單">🔄 高頻低單</option>
                                <option value="低頻高單">💰 低頻高單</option>
                                <option value="影響力中心">🔥 影響力中心</option>
                                <option value="轉介紹">🤝 轉介紹</option>
                            </optgroup>
                            <optgroup label="生活型態/髮質">
                                <option value="排班制">排班制</option>
                                <option value="週休二日">週休二日</option>
                                <option value="學生">學生</option>
                                <option value="貴婦">貴婦</option>
                                <option value="無業待業">無業待業</option>
                                <option value="易出油">易出油</option>
                                <option value="細軟髮">細軟髮</option>
                                <option value="粗硬髮">粗硬髮</option>
                                <option value="自然捲">自然捲</option>
                            </optgroup>
                        </select>
                        <input type="text" id="searchInput" class="form-control border-0 bg-light" list="customerDataList" placeholder="🔍 姓名/電話">
                        <datalist id="customerDataList"></datalist>
                        <button class="btn btn-light border-0 px-3" onclick="searchCustomer()">搜尋</button>
                        <button class="btn btn-custom px-3" onclick="showCalendar()">行事曆</button>
                    </div>
                    <div id="calendarArea"><div id="calendar"></div></div>
                    <div id="historyArea" style="display: none;"><div id="historyResult"></div></div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card h-100 shadow-sm" style="background: #ffffff;">
                <div class="card-header text-dark border-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="serif m-0" style="font-size: 1.1rem;">🎯 待聯繫名單</h5>
                        <small class="text-danger fw-normal" style="font-size: 0.8rem;">打勾確認後才會隱藏</small>
                    </div>
                </div>
                <div class="card-body p-3 mt-1" id="reminderList">
                    <div class="text-center text-muted spinner-border spinner-border-sm" role="status"></div> 讀取中...
                </div>
            </div>
        </div>
    </div>
</div>

<div class="fab" data-bs-toggle="modal" data-bs-target="#addRecordModal">+</div>

<div class="modal fade" id="addRecordModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content" style="border-radius: 18px; border: none;">
      <div class="modal-header" style="background: #fdfbf7; border-bottom: 1px solid #f0e6da; padding: 16px 20px;">
        <h5 class="modal-title serif text-dark">✍️ 新增消費紀錄</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3 p-md-4">
        <form id="recordForm">
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label text-muted small">姓名 *</label>
                    <input type="text" class="form-control" id="formName" list="formCustomerList" onchange="autoFillCustomer()" placeholder="輸入舊客帶入" required>
                    <datalist id="formCustomerList"></datalist>
                </div>
                <div class="col-md-3"><label class="form-label text-muted small">電話</label><input type="text" class="form-control" id="formPhone"></div>
                <div class="col-md-3"><label class="form-label text-muted small">生日 (選填)</label><input type="text" class="form-control" id="formBirthday" placeholder="例: 12/17"></div>
                <div class="col-md-3"><label class="form-label text-muted small">性別</label><select class="form-select" id="formGender"><option value="女">女</option><option value="男">男</option></select></div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label text-muted small">年齡層</label>
                    <select class="form-select" id="formAge">
                        <option value="">(未知)</option><option value="< 20歲">&lt; 20歲</option><option value="21-25歲">21-25歲</option>
                        <option value="26-30歲">26-30歲</option><option value="31-40歲">31-40歲</option><option value="41-50歲">41-50歲</option><option value="50歲以上">50歲以上</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">生活型態</label>
                    <select class="form-select" id="formLifestyle">
                        <option value="">(選填)</option>
                        <option value="排班制">排班制</option>
                        <option value="週休二日">週休二日</option>
                        <option value="學生">學生</option>
                        <option value="貴婦">貴婦</option>
                        <option value="無業待業">無業待業</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small">頭髮長度</label>
                    <select class="form-select" id="formHair">
                        <option value="光頭">光頭</option>
                        <option value="短髮">短髮</option>
                        <option value="中長髮">中長髮</option>
                        <option value="長髮">長髮</option>
                    </select>
                </div>
                <div class="col-md-3"><label class="form-label text-muted small">消費日</label><input type="date" class="form-control" id="formDate" required></div>
            </div>
            
            <div class="mb-3 bg-light p-3 rounded-3 border" style="border-color: #f0e6da !important;">
                <label class="form-label text-muted small d-block mb-2">髮質與頭皮狀況 (可複選，自動覆蓋舊資料)</label>
                <div class="d-flex flex-wrap gap-3">
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="細軟髮" id="hc1"><label class="form-check-label small" for="hc1">細軟髮</label></div>
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="粗硬髮" id="hc2"><label class="form-check-label small" for="hc2">粗硬髮</label></div>
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="易出油" id="hc3"><label class="form-check-label small" for="hc3">易出油</label></div>
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="乾頭皮" id="hc4"><label class="form-check-label small" for="hc4">乾頭皮</label></div>
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="髮量少" id="hc5"><label class="form-check-label small" for="hc5">髮量少</label></div>
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="髮量多" id="hc6"><label class="form-check-label small" for="hc6">髮量多</label></div>
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="自然捲" id="hc7"><label class="form-check-label small" for="hc7">自然捲</label></div>
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="毛燥" id="hc8"><label class="form-check-label small" for="hc8">毛燥</label></div>
                    <div class="form-check"><input class="form-check-input hc-cb" type="checkbox" value="柔順" id="hc9"><label class="form-check-label small" for="hc9">柔順</label></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6"><label class="form-label text-muted small">介紹人 (選填)</label><input type="text" class="form-control" id="formReferrer" placeholder="推薦人姓名"></div>
                <div class="col-md-6"><label class="form-label text-muted small">📸 上傳作品照 (可多選，秒傳壓縮)</label><input class="form-control" type="file" id="formPhoto" accept="image/*" multiple></div>
            </div>

            <div class="mb-3 bg-light p-3 rounded-3">
                <label class="form-label text-muted small d-block mb-2">服務項目</label>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="洗剪" id="srv1"><label class="form-check-label" for="srv1">洗剪</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="染髮" id="srv2"><label class="form-check-label" for="srv2">染髮</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="燙髮" id="srv3"><label class="form-check-label" for="srv3">燙髮</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="護髮" id="srv4"><label class="form-check-label" for="srv4">護髮</label></div>
            </div>
            <div class="mb-3"><label class="form-label text-muted small">染燙配方</label><input type="text" class="form-control" id="formFormula"></div>
            <div class="row mb-3">
                <div class="col-md-6"><label class="form-label text-muted small">消費金額</label><input type="number" class="form-control" id="formAmount"></div>
                <div class="col-md-6"><label class="form-label text-muted small">購買產品 (60天自動提醒)</label><input type="text" class="form-control" id="formProducts"></div>
            </div>
            <div class="mb-3"><label class="form-label text-muted small">備註 (聊天內容)</label><textarea class="form-control" id="formMemo" rows="2" placeholder="包含 想/要/考慮 染/燙 等字眼，AI會自動捕捉"></textarea></div>
            
            <button type="submit" class="btn btn-custom w-100 py-2 mt-2" id="submitBtn">儲存紀錄</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwKadEE9GfMYxDG6cHDz3qaUHFZx6qzG3A7Q8T2HyImWlAP5vt1K-Wn9hk51YZ369Vmug/exec';
    
    let calendar;
    let globalCustomers = [];

    document.getElementById('todayDate').innerText = new Date().toLocaleDateString('zh-TW');
    document.getElementById('formDate').valueAsDate = new Date(); 

    document.getElementById('addRecordModal').addEventListener('hidden.bs.modal', function () {
        document.getElementById('recordForm').reset();
        document.getElementById('formDate').valueAsDate = new Date(); 
        document.querySelectorAll('.hc-cb').forEach(cb => cb.checked = false); 
    });

    function loadDashboard() {
        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getDashboard' }) })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                renderReminders(data.data.reminders);
                renderDataList(data.data.customers);
                initCalendar(data.data.events);
            }
        });
    }

    function renderDataList(customers) {
        globalCustomers = customers; 
        const dl = document.getElementById('customerDataList');
        const formDl = document.getElementById('formCustomerList');
        dl.innerHTML = ''; if(formDl) formDl.innerHTML = '';
        customers.forEach(c => { 
            let vipMark = c.vip ? ` [${c.vip}]` : '';
            dl.innerHTML += `<option value="${c.name}">${c.phone || ''}${vipMark}</option>`; 
            if(formDl) formDl.innerHTML += `<option value="${c.name}">${c.phone || ''}</option>`;
        });
    }

    function autoFillCustomer() {
        const nameInput = document.getElementById('formName').value;
        const cust = globalCustomers.find(c => c.name === nameInput);
        if (cust) {
            if (cust.phone) document.getElementById('formPhone').value = cust.phone;
            if (cust.birthday) document.getElementById('formBirthday').value = cust.birthday;
            if (cust.gender) document.getElementById('formGender').value = cust.gender;
            if (cust.hair) document.getElementById('formHair').value = cust.hair;
            if (cust.age) document.getElementById('formAge').value = cust.age;
            if (cust.lifestyle) document.getElementById('formLifestyle').value = cust.lifestyle;
            
            document.querySelectorAll('.hc-cb').forEach(cb => cb.checked = false);
            if (cust.hairCondition) {
                let hcs = cust.hairCondition.split(',');
                document.querySelectorAll('.hc-cb').forEach(cb => {
                    if (hcs.includes(cb.value)) cb.checked = true;
                });
            }
        }
    }

    function initCalendar(eventsData) {
        const calendarEl = document.getElementById('calendar');
        if(calendar) { calendar.destroy(); }

    function parseDriveFileId(url) {
        if (!url) return '';
        let match = url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) return match[1];
        let slashMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (slashMatch && slashMatch[1]) return slashMatch[1];
        return '';
    }

    function searchCustomer() {

        const filterTag = document.getElementById('searchTagFilter').value;

        document.getElementById('historyArea').style.display = 'block';

        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'searchCustomers', payload: { keyword: keyword, tag: filterTag } }) })
        .then(res => res.json()).then(data => {
            resDiv.innerHTML = '';
            if (data.data.length === 0) { resDiv.innerHTML = '<p class="text-danger mt-3 text-center">找不到符合條件的顧客紀錄</p>'; return; }
            data.data.forEach(item => {
                let photoUrls = item.photo ? item.photo.split(',').map(u => u.trim()).filter(u => u) : [];
                let photoHtml = '';
                if (photoUrls.length > 0) {
                    photoHtml = '<div class="d-flex flex-wrap gap-2 mt-3">';
                    photoUrls.forEach(url => {
                        let fileId = parseDriveFileId(url);
                        let cdnUrl = fileId ? `https://lh3.googleusercontent.com/d/${fileId}` : url;
                        let rawUrl = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w800` : url;
                        let originalUrl = fileId ? `https://drive.google.com/uc?id=${fileId}` : url;
                        photoHtml += `<img src="${cdnUrl}" referrerpolicy="no-referrer" class="history-photo" onclick="window.open('${originalUrl}')" title="點擊開啟原圖" onerror="if(this.src!=='${rawUrl}') this.src='${rawUrl}';">`;
                    });
                    photoHtml += '</div>';

                resDiv.innerHTML += `
                    <div class="card bg-light border-0 mb-3 shadow-sm p-3" style="border-left: 4px solid var(--primary-color) !important;">
                        <div class="d-flex justify-content-between align-items-start">

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 1200; 
                    let width = img.width, height = img.height;
                    
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve({ base64: canvas.toDataURL('image/jpeg', 0.8).split(',')[1], mimeType: 'image/jpeg' });
                };
            };
        });
    }

    document.getElementById('recordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn'); btn.innerText = '儲存與照片壓縮中...'; btn.disabled = true;
        const services = [];
        [1,2,3,4].forEach(i => { const cb = document.getElementById('srv'+i); if(cb.checked) services.push(cb.value); });

        const hairConds = [];
        document.querySelectorAll('.hc-cb:checked').forEach(cb => hairConds.push(cb.value));

        const payload = {
            name: document.getElementById('formName').value, phone: document.getElementById('formPhone').value,
            birthday: document.getElementById('formBirthday').value, gender: document.getElementById('formGender').value, 
            hairLength: document.getElementById('formHair').value, ageRange: document.getElementById('formAge').value,
            lifestyle: document.getElementById('formLifestyle').value, hairCondition: hairConds.join(','),
            date: document.getElementById('formDate').value, referrer: document.getElementById('formReferrer').value,
            services: services, formula: document.getElementById('formFormula').value, amount: document.getElementById('formAmount').value,
            products: document.getElementById('formProducts').value, memo: document.getElementById('formMemo').value,
            photos: []
        };

        const fileInput = document.getElementById('formPhoto');
        if (fileInput.files.length > 0) {
            let promises = [];
            for(let i=0; i<fileInput.files.length; i++) promises.push(compressImage(fileInput.files[i]));
            payload.photos = await Promise.all(promises);
        }

        fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'addRecord', payload: payload }) })
        .then(res => res.json()).then(data => {
            if(data.status === 'success') {
                document.getElementById('recordForm').reset();
                bootstrap.Modal.getInstance(document.getElementById('addRecordModal')).hide();
                loadDashboard(); 
            } else alert('錯誤: ' + data.message);
            btn.innerText = '儲存紀錄'; btn.disabled = false;
        });
    });

    window.onload = loadDashboard;
